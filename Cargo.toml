[workspace]
resolver = "2"
members = ["crates/bouteca-core", "src-tauri"]

[workspace.package]
version = "1.2.0"
edition = "2021"
authors = ["bout"]
license = "UNLICENSED"
repository = "https://github.com/bouthex/bouteca"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli"] }
tracing = "0.1"
parking_lot = "0.12"
url = "2"

[profile.release]
# Binario pequeño y rápido: Bouteca prioriza bajo consumo.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
