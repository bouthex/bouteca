[package]
name = "bouteca"
description = "Bouteca — buscador universal de memes, GIFs, videos y sonidos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "bouteca"

[lib]
name = "bouteca_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bouteca-core = { path = "../crates/bouteca-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tracing-appender = "0.2"
futures.workspace = true
reqwest.workspace = true
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# Credenciales en el Administrador de credenciales de Windows (cifrado por el sistema).
keyring = { version = "3", features = ["windows-native"] }
