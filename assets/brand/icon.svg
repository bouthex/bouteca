<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5468"/>
      <stop offset="1" stop-color="#FF8A4C"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5468"/>
      <stop offset="1" stop-color="#FF7650"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7A0F22" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <!-- "b": lomo de libro + cuerpo redondeado (Bout + biblioteca) -->
    <rect x="276" y="196" width="138" height="628" rx="69" fill="#FFFFFF"/>
    <path d="M345 404 H562 A210 210 0 0 1 562 824 H345 Z" fill="#FFFFFF"/>
    <!-- botón de reproducción recortado en el cuerpo -->
    <path d="M488 520 Q488 494 511 506 L641 584 Q662 597 641 610 L511 688 Q488 700 488 674 Z" fill="url(#play)"/>
  </g>
  <!-- chispa: lo divertido / lo viral -->
  <path d="M742 196 C752 250 766 264 820 274 C766 284 752 298 742 352 C732 298 718 284 664 274 C718 264 732 250 742 196 Z" fill="#FFFFFF" opacity="0.95"/>
</svg>
