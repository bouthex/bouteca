name: Instalador Windows

# Se ejecuta a mano o al crear una etiqueta de versión (v0.1.0, v0.2.0…).
# Compila en Windows real y publica el instalador NSIS como artefacto descargable.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Dependencias de la interfaz
        working-directory: ui
        run: npm ci
      - name: Pruebas del núcleo en Windows
        run: cargo test -p bouteca-core
      - name: Compilar instalador
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build
      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bouteca-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bouteca.exe
          if-no-files-found: error
          retention-days: 30
