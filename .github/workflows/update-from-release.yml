name: Actualización real desde la versión publicada (Windows)

# Prueba la actualización como la vive el usuario: instala la versión PUBLICADA en GitHub
# Releases (la que tienen las personas), carga datos de usuario y la actualiza a la versión
# candidata compilada en este commit y firmada con la clave PERMANENTE (la misma que verifica la
# clave pública incluida en las instalaciones existentes). La app usa su propio actualizador;
# el manifiesto y el instalador se sirven localmente mediante un proxy de prueba (mitmproxy),
# así no se publica nada. Requiere los secretos de firma; sin ellos, no corre.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Versión publicada desde la que se actualiza (etiqueta)"
        default: "v1.1.0"
        required: true
  push:
    branches: [main]
    paths-ignore: ["**.md", "relay/**"]

permissions:
  contents: read

concurrency:
  group: update-from-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ inputs.base || 'v1.1.0' }}
    steps:
      - uses: actions/checkout@v5
      - name: Requisitos y versión candidata
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$PUBKEY" ]; then
            echo "::warning title=Sin firma::No hay secretos de firma: no se puede probar la actualización real."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          base="${BASE#v}"
          # Si la versión del commit todavía no supera a la publicada, se prueba con una
          # versión de prueba mayor (solo cambia el número; el código es el mismo).
          newer=$(node -e "const [a,b]=process.argv.slice(1).map(v=>v.split(/[.-]/).slice(0,3).map(Number));console.log(a[0]-b[0]||a[1]-b[1]||a[2]-b[2])" "$conf" "$base")
          if [ "$newer" -gt 0 ]; then cand="$conf"; else IFS=. read -r M m p <<< "$base"; cand="$M.$m.$((p+1))-e2e.${GITHUB_RUN_NUMBER}"; fi
          echo "CAND=$cand" >> "$GITHUB_ENV"
          echo "::notice title=Actualización a probar::$base (publicada) → $cand (este commit, firma permanente)"
      - uses: dtolnay/rust-toolchain@stable
        if: env.SKIP != '1'
      - uses: Swatinem/rust-cache@v2
        if: env.SKIP != '1'
      - uses: actions/setup-node@v5
        if: env.SKIP != '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Compilar la candidata firmada con la clave permanente
        if: env.SKIP != '1'
        shell: bash
        run: |
          (cd ui && npm ci)
          # Candidata de prueba: mismo código, la versión de prueba y la depuración de WebView2
          # habilitada (para verificar los datos después de actualizar). Firma permanente real.
          node scripts/e2e-config.mjs 9224 "$CAND" "$PUBKEY" > "$RUNNER_TEMP/cand.json"
          node ui/node_modules/@tauri-apps/cli/tauri.js build --config "$RUNNER_TEMP/cand.json"
          exe=$(ls target/release/bundle/nsis/*_${CAND}_x64-setup.exe | head -1)
          node scripts/verify-sig.mjs "$exe" "$exe.sig" "$PUBKEY"
          mkdir -p "$RUNNER_TEMP/srv"
          cp "$exe" "$RUNNER_TEMP/srv/setup.exe"
          node scripts/make-manifest.mjs "$CAND" "$exe.sig" "https://github.com/bouthex/bouteca/releases/download/e2e-update-test/setup.exe" "Prueba de actualización" "$RUNNER_TEMP/srv/latest.json"
      - name: Instalar la versión publicada y cargar datos de usuario
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          gh release download $env:BASE -p "*-setup.exe" -D "$env:RUNNER_TEMP\base" --clobber
          $setup = Get-ChildItem "$env:RUNNER_TEMP\base\*-setup.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Bouteca\bouteca.exe'
          if (-not (Test-Path $exe)) { Write-Output "::error::no se instaló $env:BASE"; exit 1 }
          "BOUTECA_EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # Primer arranque: crea la base de datos y los ajustes; luego se cierra.
          $p = Start-Process $exe -PassThru; Start-Sleep 15
          Get-Process bouteca, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 3
          $data = Join-Path $env:APPDATA 'com.bouteca.app'
          $seed = @'
          import json, sqlite3, sys, time, os
          d = sys.argv[1]; now = int(time.time())
          item = {"uid": "e2e:favorito", "provider": "wikimedia", "provider_id": "e2e", "kind": "image", "title": "Favorito de prueba e2e",
                  "tags": ["e2e"], "thumbnail": None, "preview": None, "page_url": None, "author": None, "license": None, "license_url": None,
                  "width": None, "height": None, "duration_secs": None, "popularity": None, "renditions": [], "needs_resolve": False, "download_policy": "free"}
          db = sqlite3.connect(os.path.join(d, "bouteca.db"))
          db.execute("INSERT OR REPLACE INTO favorites(uid, item_json, added_at, available) VALUES (?, ?, ?, 1)", (item["uid"], json.dumps(item), now))
          cur = db.execute("INSERT INTO collections(name, created_at) VALUES ('Coleccion e2e', ?)", (now,))
          db.execute("INSERT INTO collection_items(collection_id, uid, item_json, added_at, available) VALUES (?, ?, ?, ?, 1)", (cur.lastrowid, item["uid"], json.dumps(item), now))
          db.execute("INSERT INTO studio_projects(name, description, created_at, updated_at) VALUES ('Terror', 'video de terror e2e', ?, ?)", (now, now))
          db.execute("INSERT INTO search_history(query, filter, at) VALUES ('prueba e2e actualizacion', 'all', ?)", (now,))
          db.commit(); db.close()
          sp = os.path.join(d, "settings.json")
          s = json.load(open(sp, encoding="utf-8")) if os.path.exists(sp) else {}
          s["theme"] = "light"
          json.dump(s, open(sp, "w", encoding="utf-8"))
          print("datos sembrados en", d)
          '@
          $seed | python - "$data"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::no se pudieron sembrar los datos"; exit 1 }
          # Clave de API en el Administrador de credenciales, como la guarda la app (keyring).
          cmdkey /generic:pexels.Bouteca /user:pexels /pass:clave-de-prueba-e2e | Out-Null
          Write-Output "::notice title=Instalada y con datos::$($setup.Name)"
      - name: La versión publicada se actualiza sola (clic real en "Reiniciar y actualizar")
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          # Proxy de prueba en el mismo paso (los procesos de un paso no sobreviven al siguiente).
          python -m pip install --quiet mitmproxy
          # Autoridad de prueba del proxy, confiada solo en este runner efímero.
          $p = Start-Process mitmdump -ArgumentList '-p','8899','-q' -PassThru; Start-Sleep 6; Stop-Process $p -Force
          certutil -addstore -f Root "$env:USERPROFILE\.mitmproxy\mitmproxy-ca-cert.cer" | Out-Null
          $srv = "$env:RUNNER_TEMP\srv".Replace('\','/')
          @"
          from mitmproxy import http
          SRV = r"$srv"
          def request(flow: http.HTTPFlow):
              h, path = flow.request.pretty_host, flow.request.path
              if h == "github.com" and path.endswith("/releases/latest/download/latest.json"):
                  flow.response = http.Response.make(200, open(SRV + "/latest.json", "rb").read(), {"Content-Type": "application/json"})
              elif h == "github.com" and path.startswith("/bouthex/bouteca/releases/download/e2e-update-test/"):
                  flow.response = http.Response.make(200, open(SRV + "/setup.exe", "rb").read(), {"Content-Type": "application/octet-stream"})
          "@ | Out-File -Encoding utf8 "$env:RUNNER_TEMP\addon.py"
          Start-Process mitmdump -ArgumentList '-p','8899','-s',"$env:RUNNER_TEMP\addon.py",'--set','flow_detail=1' -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\mitm.log" -RedirectStandardError "$env:RUNNER_TEMP\mitm.err"
          Start-Sleep 4
          $env:HTTPS_PROXY = "http://127.0.0.1:8899"
          $t0 = Get-Date
          $p = Start-Process $env:BOUTECA_EXE -PassThru
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $A = [System.Windows.Automation.AutomationElement]
          $name = New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, 'Reiniciar y actualizar')
          $btn = $null
          for ($i = 0; $i -lt 300 -and -not $btn; $i++) {
            Start-Sleep 1
            $win = $A::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition($A::ProcessIdProperty, $p.Id)))
            if ($win) { $btn = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $name) }
          }
          if (-not $btn) {
            Write-Output "::error title=Actualización::la versión publicada no ofreció la actualización en 5 minutos"
            Write-Output "--- solicitudes vistas por el proxy ---"; Get-Content "$env:RUNNER_TEMP\mitm.log", "$env:RUNNER_TEMP\mitm.err" -Tail 40 -ErrorAction SilentlyContinue; Get-Process mitmdump -ErrorAction SilentlyContinue | Format-Table Id, ProcessName
            Write-Output "--- registro de la app ---"; Get-ChildItem "$env:LOCALAPPDATA\com.bouteca.app\logs" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1 | Get-Content -Tail 40
            Write-Output "--- botones visibles (UI Automation) ---"
            $win = $A::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition($A::ProcessIdProperty, $p.Id)))
            if ($win) { $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button))) | Select-Object -First 40 | ForEach-Object { $_.Current.Name } } else { Write-Output "(sin ventana)" }
            exit 1
          }
          $secs = [math]::Round(((Get-Date) - $t0).TotalSeconds)
          Write-Output "::notice title=Detectada, descargada y verificada::la app ofreció instalar en $secs s desde que se abrió"
          $btn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          "T_INSTALL=$((Get-Date).ToString('o'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Verificar versión nueva, datos y claves
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:RUNNER_TEMP\upd | Out-Null
          Copy-Item scripts/update-from-release.mjs $env:RUNNER_TEMP\upd\
          Push-Location $env:RUNNER_TEMP\upd
          npm init -y | Out-Null
          npm install --no-audit --no-fund playwright-core@1 | Out-Null
          node update-from-release.mjs $env:CAND update-report.json
          $code = $LASTEXITCODE
          Copy-Item update-report.json $env:GITHUB_WORKSPACE\ -ErrorAction SilentlyContinue
          Pop-Location
          $r = Get-Content $env:GITHUB_WORKSPACE\update-report.json -Raw | ConvertFrom-Json
          foreach ($s in $r.steps) { Write-Output "::notice title=$(if ($s.ok) {'OK'} else {'FALLA'}) — $($s.name)::$($s.detail)" }
          $secs = [math]::Round(((Get-Date) - [datetime]$env:T_INSTALL).TotalSeconds)
          if ($code -ne 0) { Write-Output "::error title=Actualización desde $env:BASE::$($r.error)"; exit 1 }
          Write-Output "::notice title=Actualización real::$env:BASE → $($r.to) con datos y claves conservados"
      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != '1'
        with:
          name: update-from-release
          path: update-report.json
          if-no-files-found: ignore
