name: Desplegar servicio central (Cloudflare Workers, plan gratuito)

# Publica relay/worker.js en la cuenta de Cloudflare del propietario y carga las claves de las
# fuentes como SECRETOS DEL WORKER (nunca en el repositorio ni en la app). Al terminar, guarda la
# URL pública en relay/endpoint.json: las apps instaladas la leen y empiezan a usar el servicio
# sin necesidad de actualizar Bouteca.
#
# Requiere (GitHub → Settings → Secrets and variables → Actions), ver relay/README.md:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  y las claves de fuentes que quieras ofrecer:
#   BOUTECA_KEY_GIPHY, BOUTECA_KEY_YOUTUBE, BOUTECA_KEY_KLIPY, BOUTECA_KEY_FREESOUND,
#   BOUTECA_KEY_PIXABAY, BOUTECA_KEY_PEXELS (las que falten simplemente no se ofrecen).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["relay/worker.js", "relay/wrangler.toml"]

permissions:
  contents: write

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pruebas del servicio
        run: node relay/worker.test.mjs
      - name: Comprobar configuración
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Servicio central no configurado::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID (relay/README.md). No se despliega."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Desplegar y cargar secretos
        if: env.SKIP != '1'
        working-directory: relay
        env:
          GIPHY_KEY: ${{ secrets.BOUTECA_KEY_GIPHY }}
          YOUTUBE_KEY: ${{ secrets.BOUTECA_KEY_YOUTUBE }}
          KLIPY_KEY: ${{ secrets.BOUTECA_KEY_KLIPY }}
          FREESOUND_KEY: ${{ secrets.BOUTECA_KEY_FREESOUND }}
          PIXABAY_KEY: ${{ secrets.BOUTECA_KEY_PIXABAY }}
          PEXELS_KEY: ${{ secrets.BOUTECA_KEY_PEXELS }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log | grep -v -i "token" || true
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error title=Despliegue::no se obtuvo la URL del Worker"; exit 1; }
          offered=""
          for name in GIPHY_KEY YOUTUBE_KEY KLIPY_KEY FREESOUND_KEY PIXABAY_KEY PEXELS_KEY; do
            val="${!name}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx --yes wrangler@4 secret put "$name" > /dev/null
              offered="$offered ${name%_KEY}"
            fi
          done
          rm -f deploy.log
          echo "RELAY_URL=$url" >> "$GITHUB_ENV"
          echo "::notice title=Servicio central::$url — fuentes:${offered:- ninguna}"
      - name: Verificar el servicio publicado
        if: env.SKIP != '1'
        run: |
          sleep 5
          cfg=$(curl -fsS "$RELAY_URL/config")
          echo "::notice title=Configuración remota::$cfg"
      - name: Publicar la URL para las apps instaladas
        if: env.SKIP != '1'
        run: |
          printf '{"base": "%s"}\n' "$RELAY_URL" > relay/endpoint.json
          if ! git diff --quiet relay/endpoint.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add relay/endpoint.json
            git commit -m "Servicio central: URL publicada ($RELAY_URL)"
            git push
          fi
