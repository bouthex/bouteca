name: Publicar versión (firmada)

# Se ejecuta al subir una etiqueta vX.Y.Z (estable) o vX.Y.Z-beta.N / -rc.N (beta).
# Una etiqueta o un commit no publican nada por sí solos fuera de este flujo.
#
# Requisitos (los configura el propietario; ver RELEASING.md):
#   - Secreto  TAURI_SIGNING_PRIVATE_KEY           (clave privada minisign, nunca en el repo)
#   - Secreto  TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (su contraseña)
#   - Variable TAURI_UPDATER_PUBKEY                (clave pública: se incluye en la compilación)
# Sin ellos el flujo se detiene antes de compilar: nunca se publica una versión sin firma.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Verificar firma configurada y versión
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$PUBKEY" ]; then
            echo "::error title=Firma no configurada::Faltan TAURI_SIGNING_PRIVATE_KEY o la variable TAURI_UPDATER_PUBKEY. Ver RELEASING.md. No se publica nada sin firma."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$conf" ]; then
            echo "::error title=Versión distinta::La etiqueta ($tag) no coincide con tauri.conf.json ($conf)."
            exit 1
          fi
          case "$tag" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV";; *) echo "PRERELEASE=false" >> "$GITHUB_ENV";; esac
          echo "VERSION=$tag" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Dependencias de la interfaz
        working-directory: ui
        run: npm ci
      - name: Pruebas del núcleo
        run: cargo test -p bouteca-core
      - name: Compilar instalador firmado
        shell: bash
        run: |
          node -e "process.stdout.write(JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.PUBKEY}}}))" > "$RUNNER_TEMP/release-config.json"
          node ui/node_modules/@tauri-apps/cli/tauri.js build --config "$RUNNER_TEMP/release-config.json"
      - name: Preparar archivos y manifiesto
        shell: bash
        run: |
          dir=target/release/bundle/nsis
          exe=$(ls "$dir"/*-setup.exe | head -1)
          sig="$exe.sig"
          test -f "$sig" || { echo "::error::No se generó la firma del instalador"; exit 1; }
          name=$(basename "$exe")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${name// /.}"
          notes=$(git log -1 --pretty=%B | head -c 3000)
          node -e '
            const fs=require("fs");
            const m={version:process.env.VERSION,notes:process.argv[1],pub_date:new Date().toISOString(),
              platforms:{"windows-x86_64":{signature:fs.readFileSync(process.argv[2],"utf8").trim(),url:process.argv[3]}}};
            fs.writeFileSync("latest.json",JSON.stringify(m,null,2));' "$notes" "$sig" "$url"
          cp latest.json beta.json
          sha256sum "$exe" | tee SHA256SUMS.txt
          echo "EXE=$exe" >> "$GITHUB_ENV"
          echo "SIG=$sig" >> "$GITHUB_ENV"
      - name: Publicar en GitHub Releases
        shell: bash
        run: |
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease --latest=false"
          gh release create "$GITHUB_REF_NAME" "$EXE" "$SIG" latest.json SHA256SUMS.txt --title "Bouteca $VERSION" --generate-notes $flags
          # Canal beta: recibe todas las versiones (beta y estables).
          gh release view updater-beta >/dev/null 2>&1 || gh release create updater-beta --title "Canal beta (técnico)" --notes "Manifiesto del canal beta del actualizador. No instalar desde aquí." --prerelease --latest=false
          gh release upload updater-beta beta.json --clobber
          echo "::notice title=Publicada::Bouteca $VERSION ($([ "$PRERELEASE" = true ] && echo beta || echo estable))"
